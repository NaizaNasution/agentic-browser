name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - run: npm ci
      # B-02: generated protocol code must match the schema
      - run: npm run codegen:check
      # A-03
      - run: npm run typecheck
      # A-04: codegen tests, app unit tests, go vet + go test
      - run: npm test
      - run: npm run build:cli

  e2e:
    name: End-to-end (windows-latest)
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - run: npm ci
      - run: npm run build:cli
      - run: npm run test:e2e
